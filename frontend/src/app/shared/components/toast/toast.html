<div class="pointer-events-none fixed right-4 bottom-4 z-50 flex w-full max-w-sm flex-col gap-2.5 sm:right-6 sm:bottom-6">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="toast-item pointer-events-auto flex items-start gap-3 rounded-xl border px-4 py-3 text-sm shadow-2xl shadow-black/40 backdrop-blur-sm"
      [class]="
        toast.tipo === 'sucesso'
          ? 'border-emerald-500/30 bg-ink-900/95 text-emerald-200'
          : 'border-rose-500/30 bg-ink-900/95 text-rose-200'
      "
      role="status"
    >
      <span
        class="mt-0.5 flex size-5 shrink-0 items-center justify-center rounded-full"
        [class]="toast.tipo === 'sucesso' ? 'bg-emerald-400/15 text-emerald-300' : 'bg-rose-400/15 text-rose-300'"
        aria-hidden="true"
      >
        @if (toast.tipo === 'sucesso') {
          <svg class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3" aria-hidden="true">
            <path d="m5 12 4.5 4.5L19 7" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        } @else {
          <svg class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3" aria-hidden="true">
            <path d="M12 9v4m0 4h.01M10.3 3.9 1.9 18.3a1.5 1.5 0 0 0 1.3 2.2h17.6a1.5 1.5 0 0 0 1.3-2.2L13.7 3.9a1.5 1.5 0 0 0-2.6 0Z" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        }
      </span>

      <p class="flex-1 pt-0.5 leading-snug text-slate-200">{{ toast.texto }}</p>

      <button
        type="button"
        (click)="toastService.remover(toast.id)"
        aria-label="Fechar mensagem"
        class="mt-0.5 shrink-0 rounded-full p-1 text-slate-500 transition hover:bg-white/5 hover:text-slate-300 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-400"
      >
        <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="m6 6 12 12M18 6 6 18" stroke-linecap="round" />
        </svg>
      </button>
    </div>
  }
</div>
