<aside
  class="sticky top-0 flex h-dvh shrink-0 flex-col border-r border-white/10 bg-ink-900 transition-[width] duration-200"
  [class.w-64]="aberta()"
  [class.w-20]="!aberta()"
>
  <div class="flex items-center gap-2 px-4 py-5">
    @if (aberta()) {
      <span class="truncate text-lg font-bold tracking-wide text-white">{{ nomeExibido() }}</span>
    }

    <button
      type="button"
      (click)="alternar()"
      class="ml-auto flex size-8 shrink-0 items-center justify-center rounded-lg text-slate-300 transition hover:bg-white/5 hover:text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-300"
      [attr.aria-label]="aberta() ? 'Recolher menu' : 'Expandir menu'"
    >
      <svg
        class="size-5 transition-transform duration-200"
        [class.rotate-180]="!aberta()"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="M11 19l-7-7 7-7m8 14l-7-7 7-7" />
      </svg>
    </button>
  </div>

  <nav class="flex flex-1 flex-col gap-1 px-3">
    <a
      [routerLink]="ambiente() === 'empresa' ? '/empresa/painel' : '/teste'"
      routerLinkActive="bg-white/10 text-brand-300"
      class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-slate-300 transition hover:bg-white/5 hover:text-white"
      [attr.title]="!aberta() ? 'Início' : null"
    >
      <svg class="size-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"
        />
      </svg>
      @if (aberta()) {
        <span class="truncate">Início</span>
      }
    </a>

    @if (ambiente() === 'empresa') {
      <a
        routerLink="/vagas"
        routerLinkActive="bg-white/10 text-brand-300"
        class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-slate-300 transition hover:bg-white/5 hover:text-white"
        [attr.title]="!aberta() ? 'Vagas' : null"
      >
        <svg class="size-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M20.25 14.15v4.25c0 1.094-.787 2.036-1.872 2.18-2.087.277-4.216.42-6.378.42s-4.291-.143-6.378-.42c-1.085-.144-1.872-1.086-1.872-2.18v-4.25m16.5 0a2.18 2.18 0 0 0 .75-1.661V8.706c0-1.081-.768-2.015-1.837-2.175a48.114 48.114 0 0 0-3.413-.387m4.5 8.006c-.194.165-.42.295-.673.38A23.978 23.978 0 0 1 12 15.75c-2.648 0-5.195-.429-7.577-1.22a2.016 2.016 0 0 1-.673-.38m0 0A2.18 2.18 0 0 1 3 12.489V8.706c0-1.081.768-2.015 1.837-2.175a48.111 48.111 0 0 1 3.413-.387m7.5 0V5.25A2.25 2.25 0 0 0 13.5 3h-3a2.25 2.25 0 0 0-2.25 2.25v.894m7.5 0a48.667 48.667 0 0 0-7.5 0"
          />
        </svg>
        @if (aberta()) {
          <span class="truncate">Vagas</span>
        }
      </a>
    }

    <a
      routerLink="/curso"
      routerLinkActive="bg-white/10 text-brand-300"
      class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-slate-300 transition hover:bg-white/5 hover:text-white"
      [attr.title]="!aberta() ? 'Curso' : null"
    >
      <svg class="size-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M12 6.042A8.967 8.967 0 0 0 6 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 0 1 6 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 0 1 6-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0 0 18 18a8.967 8.967 0 0 0-6 2.292m0-14.25v14.25"
        />
      </svg>
      @if (aberta()) {
        <span class="truncate">Curso</span>
      }
    </a>

    @if (ambiente() === 'empresa') {
      <a
        routerLink="/empresa/candidatos"
        routerLinkActive="bg-white/10 text-brand-300"
        class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-slate-300 transition hover:bg-white/5 hover:text-white"
        [attr.title]="!aberta() ? 'Candidatos' : null"
      >
        <svg class="size-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M18 18.72a9.094 9.094 0 0 0 3.741-.479 3 3 0 0 0-4.682-2.72m.94 3.198.001.031c0 .225-.012.447-.037.666A11.944 11.944 0 0 1 12 21c-2.17 0-4.207-.576-5.963-1.584a6.062 6.062 0 0 1-.037-.666c0-.202.011-.402.037-.666A11.944 11.944 0 0 1 12 12.75c2.17 0 4.207.576 5.963 1.584M15 6.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm6 3a2.25 2.25 0 1 1-4.5 0 2.25 2.25 0 0 1 4.5 0Zm-13.5 0a2.25 2.25 0 1 1-4.5 0 2.25 2.25 0 0 1 4.5 0Z"
          />
        </svg>
        @if (aberta()) {
          <span class="truncate">Candidatos</span>
        }
      </a>
    } @else {
      <a
        routerLink="/perfil"
        routerLinkActive="bg-white/10 text-brand-300"
        class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-slate-300 transition hover:bg-white/5 hover:text-white"
        [attr.title]="!aberta() ? 'Perfil' : null"
      >
        <svg class="size-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
          />
        </svg>
        @if (aberta()) {
          <span class="truncate">Perfil</span>
        }
      </a>
    }
  </nav>

  <div class="border-t border-white/10 px-3 py-4">
    <button
      type="button"
      (click)="sair()"
      class="flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-slate-300 transition hover:bg-white/5 hover:text-rose-300"
      [attr.title]="!aberta() ? 'Sair' : null"
    >
      <svg class="size-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M9 12h11.25m0 0-3.75-3.75M20.25 12l-3.75 3.75"
        />
      </svg>
      @if (aberta()) {
        <span class="truncate">Sair</span>
      }
    </button>
  </div>
</aside>
